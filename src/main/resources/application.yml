spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/laptoplc?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: sa1234$
    hikari:
      maximum-pool-size: 15
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
server:
  port: 8080

shop:
  jwt:
    expiration: 600000
    secretKey: mySuperSecretKeyForJwtGenerationThatIsLongEnough


<div class="container mt-4">
    <h2 class="text-center text-danger fw-bold mb-4">Tin Tức Mới Nhất</h2>
    <div class="row row-cols-1 row-cols-md-3 g-3">
      <div class="col" *ngFor="let news of newsList">
        <div class="card shadow-lg border-0 news-card">
          <img [src]="news.image_url" class="card-img-top" alt="news image">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold text-primary">{{ news.title }}</h5>
            <p class="card-text text-muted small">Đăng bởi {{ news.author }} - {{ news.created_at | date:'dd/MM/yyyy' }}</p>
            <p class="card-text flex-grow-1">{{ news.content | slice:0:100 }}...</p>
            <a [routerLink]="['/news', news.id]" class="btn btn-outline-danger btn-sm mt-auto">Xem chi tiết</a>
          </div>
        </div>
      </div>
    </div>
  </div>

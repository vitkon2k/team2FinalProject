<div>
    <h2>Danh sách sản phẩm</h2>
    <table border="1" cellpadding="8" cellspacing="0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tên sản phẩm</th>
          <th>Mô tả</th>
          <th>Giá</th>
          <th>Giá giảm</th>
          <th>Số lượng tồn</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.description }}</td>
          <td>{{ product.price }}</td>
          <td>{{ product.discount_price }}</td>
          <td>{{ product.stock }}</td>
          <td>
            <button [routerLink]="['/edit-product', product.id]">Sửa</button>
            <button (click)="deleteProduct(product.id)">Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
    <br>
    <button [routerLink]="['/add-product']">Thêm sản phẩm</button>
  </div>

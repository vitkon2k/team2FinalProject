<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-primary">📋 Danh sách sản phẩm</h2>
    <a [routerLink]="['/admin/products/add']" class="btn btn-success">
      ➕ Thêm sản phẩm
    </a>
  </div>

  <div class="card shadow p-3">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Tên sản phẩm</th>
          <th>Giá</th>
          <th>Hãng</th>
          <th class="text-center">Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td class="fw-bold">{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td class="text-success fw-bold">{{ product.price | currency:'VND' }}</td>
          <td>{{ product.brand?.name }}</td>
          <td class="text-center">
            <a [routerLink]="['/admin/products/edit/', product.id]" class="btn btn-warning btn-sm mx-1">
              ✏️ Sửa
            </a>
            <button (click)="deleteProduct(product.id)" class="btn btn-danger btn-sm mx-1">
              ❌ Xóa
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
